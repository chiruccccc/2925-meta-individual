function formatoCOP(num){
    return "$" + Number(num || 0)
    .toLocaleString("es-CO");
}

// formatearFecha()

function formatearFecha(fecha){

    if(!fecha) return "__________";

    const partes = fecha.split("-");

    const fechaLocal = new Date(
        partes[0],
        partes[1] - 1,
        partes[2]
    );

    return fechaLocal.toLocaleDateString(
        "es-CO",
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}

function agregarNotificacion(texto){

    if(notificacion.value==="personalmente"){

Finalmente se notifica personalmente al señor(a) ${nombre.value||"XXXXXX"} de la presente decisión empresarial.`;

    }

    else if(notificacion.value==="por correo electrónico"){

        texto += `
Finalmente se notifica al correo electrónico ${correo.value||"XXXXXX"} al señor(a) ${nombre.value||"XXXXXX"} de la presente decisión empresarial.`;

    }

    else if(notificacion.value==="a la dirección"){

        texto += `
Finalmente se remite comunicación a la dirección ${direccion.value||"XXXXXX"} del municipio de ${municipioNotificacion.value||"XXXXXX"} al señor(a) ${nombre.value||"XXXXXX"} de la presente decisión empresarial.`;

    }

    else if(notificacion.value==="con rebote de correo electrónico"){

        texto += `
Finalmente, en cumplimiento de lo establecido en el artículo 67 de la Ley 1437 de 2011, ESSA envió respuesta al correo electrónico ${correo.value||"XXXXXX"}, informado en su requerimiento; sin embargo, teniendo en cuenta que el certificado de entrega del correo electrónico no fue satisfactorio, se procede a citar al señor(a) ${nombre.value||"XXXXXX"} enviando comunicación a través del correo certificado a la dirección ${direccion.value||"XXXXXX"} del municipio de ${municipioNotificacion.value||"XXXXXX"}, donde se presta el servicio de energía eléctrica, para que comparezca a notificarse de la presente decisión personalmente o a través de autorizado, en la oficina de atención al cliente más cercana dentro de los cinco (5) días hábiles siguientes a la fecha de envío de esta citación.`;

    }

    return texto;

}

// calcularMeta2925()

function calcularMeta2925(){

    const servicio =
        servicio2925.value;

    const estrato =
        estrato2925.value;

    const area =
        area2925.value;

    let metaDiaria = 0;

    // RESIDENCIAL

    if(servicio === "RESIDENCIAL"){

        if(
            ["1","2","3"].includes(
                estrato
            )
        ){

            metaDiaria =
                area === "URBANA"
                ? 5.766667
                : 4.333333;

        }

        else if(
            estrato === "4"
        ){

            metaDiaria =
                area === "URBANA"
                ? 3.864368
                : 3.188393;

        }

        else if(
            estrato === "5"
        ){

            metaDiaria =
                area === "URBANA"
                ? 4.535715
                : 5.588653;

        }

        else if(
            estrato === "6"
        ){

            metaDiaria =
                area === "URBANA"
                ? 5.097869
                : 11.480646;

        }

    }

    // COMERCIAL

    if(
        servicio === "COMERCIAL"
    ){

        metaDiaria =
            area === "URBANA"
            ? 6.186024
            : 9.483871;

    }

    // INDUSTRIAL

    if(
        servicio === "INDUSTRIAL"
    ){

        metaDiaria =
            area === "URBANA"
            ? 12.648474
            : 7.891667;

    }

    const dias =
        Number(
            dias2925.value
        ) || 0;

    const metaCalculada =
        metaDiaria * dias;

    const subsistencia =
        Number(
            subsistencia2925.value
        ) || 0;

    const mostrarMetaCalculada =

        servicio === "RESIDENCIAL" &&

        ["1","2","3"].includes(
            estrato
        ) &&

        metaCalculada <
        subsistencia;

    metaCalculada2925.previousElementSibling.style.display =

        mostrarMetaCalculada
        ? "block"
        : "none";

    metaCalculada2925.style.display =

        mostrarMetaCalculada
        ? "block"
        : "none";

    metaCalculada2925.style.backgroundColor =

        mostrarMetaCalculada
        ? "#fff3cd"
        : "#f0f0f0";

    let metaPeriodo =
        metaCalculada;

    if(

        servicio === "RESIDENCIAL" &&

        ["1","2","3"].includes(
            estrato
        )

    ){

        metaPeriodo =
            Math.max(
                metaCalculada,
                subsistencia
            );

    }

    const minimo90 =
        metaPeriodo * 0.90;

    const maximo110 =
        metaPeriodo * 1.10;

            metaDiaria2925.value =
        metaDiaria
        ? metaDiaria.toFixed(6)
        : "";

    metaCalculada2925.value =
        metaCalculada
        ? metaCalculada.toFixed(3)
        : "";

    metaPeriodo2925.value =
        metaPeriodo
        ? metaPeriodo.toFixed(3)
        : "";

    meta902925.value =
        minimo90
        ? minimo90.toFixed(3)
        : "";

    meta1102925.value =
